<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои уроки — Skillcraft</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style/lesson.css">
</head>
<body>

<nav>
  <a href="/" class="logo">Skill<span>craft</span></a>
  <button class="logout-btn" id="logoutBtn" style="display:none" onclick="logout()">Выйти</button>
</nav>

<div id="appRoot"></div>
<div class="toast" id="toast"></div>

<script>
  const API_URL = 'https://skillcraft.uz';

  const LESSONS = [
    'Знакомство',
    'Форматирование',
    'Базовые формулы',
    'Абсолютные и относительные ссылки',
    'Логические функции',
    'Работа с текстом и датами',
    'Поиск данных в таблицах',
    'Условное форматирование и контроль данных',
    'Сводные таблицы',
    'Диаграммы и визуализация',
    'Финальный проект и подготовка к трудоустройству',
  ];

  const root = document.getElementById('appRoot');

  // Получаем device_token из localStorage
  function getDeviceToken() {
    let token = localStorage.getItem('sc_device_token');
    if (!token) {
      token = typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('sc_device_token', token);
    }
    return token;
  }

  async function init() {
    const token = localStorage.getItem('sc_token');
    if (!token) { renderGate(); return; }

    try {
      const res = await fetch(`${API_URL}/api/access/verify`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('invalid');
      const data = await res.json();
      document.getElementById('logoutBtn').style.display = 'block';
      renderDownload(data.phone);
    } catch {
      localStorage.removeItem('sc_token');
      renderGate();
    }
  }

  function renderDownload(phone) {
    root.innerHTML = `
      <main>
        <div class="page-tag">Мои материалы</div>
        <h1>Курс Excel<br>готов к скачиванию</h1>
        <p class="phone-line">📱 ${phone || ''} &nbsp;·&nbsp; Доступ открыт навсегда</p>

        <div class="download-card">
          <div class="download-icon">📦</div>
          <div class="download-title">11 уроков Excel — одним архивом</div>
          <p class="download-desc">
            Все материалы упакованы в один ZIP файл.<br>
            Скачай и распакуй.
          </p>

          <div class="lessons-list">
            <div class="lessons-list-title">Содержимое архива</div>
            ${LESSONS.map((l, i) => `
              <div class="lesson-row">
                <span class="lesson-num">${String(i+1).padStart(2,'0')}</span>
                <span class="lesson-name">${l}</span>
              </div>
            `).join('')}
          </div>

          <button class="btn-download" id="downloadBtn" onclick="downloadZip()">
            ↓ Скачать
          </button>

          <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar-bg">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">Загружаем архив…</div>
          </div>

          <p class="btn-note">Файл скачается на твой компьютер. Распакуй и открывай уроки.</p>

          <a href="https://t.me/+2SEZ0-gionYwZmE6" target="_blank" class="btn-telegram">
            ✈️ Перейти в закрытый Telegram канал
          </a>
          <p class="btn-note">В канале — дополнительные материалы, обновления и поддержка</p>
        </div>
      </main>
    `;
  }

  async function downloadZip() {
    const token = localStorage.getItem('sc_token');
    const btn   = document.getElementById('downloadBtn');
    const wrap  = document.getElementById('progressWrap');
    const bar   = document.getElementById('progressBar');
    const txt   = document.getElementById('progressText');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Подготавливаем архив…';
    wrap.style.display = 'block';

    try {
      const res = await fetch(`${API_URL}/api/lessons/download`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Ошибка скачивания');
      }

      const contentLength = res.headers.get('Content-Length');
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (contentLength) {
          const pct = Math.round((received / contentLength) * 100);
          bar.style.width = pct + '%';
          txt.textContent = `Загружено ${pct}%…`;
        } else {
          txt.textContent = `Загружено ${Math.round(received / 1024)} KB…`;
        }
      }

      bar.style.width = '100%';
      txt.textContent = 'Готово! Сохраняем файл…';

      const blob = new Blob(chunks, { type: 'application/zip' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'Skillcraft-Excel-11-urokov.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast('✅ Архив скачан!', 'ok');
      btn.innerHTML = '✓ Скачано';

    } catch (e) {
      console.error(e);
      showToast(e.message, 'err');
      btn.disabled = false;
      btn.innerHTML = '↓ Скачать все уроки (ZIP)';
      wrap.style.display = 'none';

      if (e.message.includes('403') || e.message.includes('401')) {
        localStorage.removeItem('sc_token');
        renderGate();
      }
    }
  }

  function renderGate() {
    root.innerHTML = `
      <div class="gate">
        <div style="font-size:48px;margin-bottom:20px">🔐</div>
        <h2>Введи номер телефона</h2>
        <p>Укажи номер телефона, который использовал при покупке курса</p>
        <input type="tel" class="sc-input" id="gatePhone" placeholder="+998 90 123 45 67" maxlength="17" />
        <div class="gate-error" id="gateErr"></div>
        <button class="sc-btn" onclick="gateLogin()">Войти →</button>
        <p style="margin-top:16px;font-size:12px;color:var(--muted)">
          Ещё не купил? <a href="/" style="color:var(--green);text-decoration:none">На главную</a>
        </p>
      </div>
    `;
    document.getElementById('gatePhone').addEventListener('keydown', e => {
      if (e.key === 'Enter') gateLogin();
    });
  }

  function renderDeviceMismatch() {
    root.innerHTML = `
      <div class="gate">
        <div style="font-size:48px;margin-bottom:20px">🔒</div>
        <h2>Доступ заблокирован</h2>
        <p>Этот номер уже используется на другом устройстве.<br>Если это вы — напишите нам в поддержку.</p>
        <a href="/" style="color:var(--green);font-size:13px;text-decoration:none">← На главную</a>
      </div>
    `;
  }

  async function gateLogin() {
    const phone = document.getElementById('gatePhone')?.value?.trim();
    const err   = document.getElementById('gateErr');
    if (!phone) return;
    err.classList.remove('visible');

    try {
      const res  = await fetch(`${API_URL}/api/access/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // Передаём device_token для проверки
        body: JSON.stringify({ phone, device_token: getDeviceToken() })
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('sc_token', data.token);
        localStorage.setItem('sc_phone', phone);
        document.getElementById('logoutBtn').style.display = 'block';
        renderDownload(phone);
      } else if (data.code === 'DEVICE_MISMATCH') {
        renderDeviceMismatch();
      } else {
        err.textContent = data.error || 'Доступ не найден';
        err.classList.add('visible');
      }
    } catch {
      const errEl = document.getElementById('gateErr');
      if (errEl) { errEl.textContent = 'Ошибка соединения'; errEl.classList.add('visible'); }
    }
  }

  function logout() {
    localStorage.removeItem('sc_token');
    document.getElementById('logoutBtn').style.display = 'none';
    renderGate();
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }


  // ─── МАСКА ТЕЛЕФОНА ───────────────────────────────────────
  document.addEventListener('input', function(e) {
    if (e.target.id !== 'gatePhone') return;
    let val = e.target.value.replace(/\D/g, '');
    if (val.startsWith('998')) val = val.slice(3);
    if (val.startsWith('0')) val = val.slice(1);
    val = val.slice(0, 9);
    let formatted = '+998';
    if (val.length > 0) formatted += ' ' + val.slice(0, 2);
    if (val.length > 2) formatted += ' ' + val.slice(2, 5);
    if (val.length > 5) formatted += ' ' + val.slice(5, 7);
    if (val.length > 7) formatted += ' ' + val.slice(7, 9);
    e.target.value = formatted;
  });

  document.addEventListener('keydown', function(e) {
    if (e.target.id !== 'gatePhone') return;
    if (e.key === 'Backspace' && e.target.value === '+998') e.preventDefault();
  });

  document.addEventListener('focus', function(e) {
    if (e.target.id !== 'gatePhone') return;
    if (!e.target.value) e.target.value = '+998 ';
  }, true);

  init();
</script>
</body>
</html>
