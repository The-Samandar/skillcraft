<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата прошла — Skillcraft</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a; --dark: #111214; --card: #16181c;
    --border: #222428; --green: #22c55e; --green-muted: rgba(34,197,94,0.08);
    --white: #f4f4f0; --muted: #8a8f9a; --accent: #a3e635;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black); color: var(--white);
    font-family: 'Mulish', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: var(--dark); border: 1px solid var(--border);
    max-width: 480px; width: 100%; padding: 48px 40px;
    text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 24px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 12px; }
  .sub { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
  .phone-badge {
    background: var(--green-muted); border: 1px solid rgba(34,197,94,0.2);
    padding: 12px 18px; font-size: 14px; color: #86efac;
    margin-bottom: 28px; word-break: break-word;
  }
  .btn {
    display: inline-block; background: var(--green); color: var(--black);
    font-family: 'Unbounded', sans-serif; font-weight: 700;
    font-size: 13px; letter-spacing: 0.05em; padding: 16px 36px;
    text-decoration: none; cursor: pointer; border: none;
    transition: all 0.2s; margin-bottom: 16px; width: 100%;
  }
  .btn:hover { background: var(--accent); transform: translateY(-1px); }
  .btn-outline {
    display: block; background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'Mulish', sans-serif;
    font-size: 13px; padding: 14px 36px; cursor: pointer;
    width: 100%; transition: border-color 0.15s;
  }
  .btn-outline:hover { border-color: var(--green); color: var(--white); }
  .note { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border); border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .phone-form { margin-bottom: 20px; }
  .phone-input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--white); font-family: 'Mulish', sans-serif;
    font-size: 14px; padding: 12px 14px; outline: none; margin-bottom: 12px;
  }
  .phone-input:focus { border-color: var(--green); }
  .error {
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
    color: #fca5a5; font-size: 13px; padding: 10px 14px; margin-bottom: 14px;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="spinner" id="loadingSpinner"></div>
  <p style="color:var(--muted)">Проверяем оплату…</p>
</div>

<script>
  const API_URL = 'https://skillcraft.uz';
  const card = document.getElementById('mainCard');

  async function init() {
    const orderId = localStorage.getItem('sc_order_id');
    const phone = localStorage.getItem('sc_phone');

    if (!orderId) {
      renderPhoneForm();
      return;
    }

    try {
      const res = await fetch(`${API_URL}/api/orders/${orderId}`);
      const order = await res.json();

      if (order.status === 'paid') {
        await getTokenAndRender(orderId, phone);
      } else if (order.status === 'pending') {
        renderPending(orderId, phone);
      } else {
        renderFailed();
      }
    } catch (e) {
      renderPhoneForm();
    }
  }

  async function getTokenAndRender(orderId, phone) {
    try {
      const res = await fetch(`${API_URL}/api/access/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId }),
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('sc_token', data.token);
        localStorage.removeItem('sc_order_id');
        renderSuccess(phone || data.phone);
      } else {
        renderPhoneForm();
      }
    } catch (e) {
      renderPhoneForm();
    }
  }

  function renderSuccess(phone) {
    card.innerHTML = `
      <div class="icon">✅</div>
      <h1>Оплата прошла!</h1>
      <p class="sub">Доступ к 11 урокам Excel открыт. Теперь ты можешь скачать все материалы.</p>
      ${phone ? `<div class="phone-badge">📱 ${phone}</div>` : ''}
      <a href="/lessons.html" class="btn">Перейти к урокам →</a>
      <p class="note">Сохрани номер телефона — он нужен для восстановления доступа</p>
    `;
  }

  function renderPending(orderId, phone) {
    card.innerHTML = `
      <div class="icon">⏳</div>
      <h1>Оплата обрабатывается</h1>
      <p class="sub">Платёж ещё не подтверждён. Обычно это занимает до 2 минут.</p>
      <button class="btn" onclick="checkAgain('${orderId}','${phone || ''}')">Проверить ещё раз</button>
      <p class="note">Если проблема не решается — введи номер телефона ниже</p>
      <br><button class="btn-outline" onclick="renderPhoneForm()">Ввести номер вручную</button>
    `;
  }

  async function checkAgain(orderId, phone) {
    card.innerHTML = `<div class="spinner"></div><p style="color:var(--muted)">Проверяем…</p>`;
    try {
      const res = await fetch(`${API_URL}/api/orders/${orderId}`);
      const order = await res.json();
      if (order.status === 'paid') {
        await getTokenAndRender(orderId, phone);
      } else {
        renderPending(orderId, phone);
      }
    } catch (e) {
      renderPending(orderId, phone);
    }
  }

  function renderFailed() {
    card.innerHTML = `
      <div class="icon">❌</div>
      <h1>Оплата не прошла</h1>
      <p class="sub">Что-то пошло не так. Попробуй снова.</p>
      <a href="/" class="btn">← Вернуться на главную</a>
    `;
  }

  function renderPhoneForm() {
    card.innerHTML = `
      <div class="icon">🔑</div>
      <h1>Войти по номеру</h1>
      <p class="sub">Введи номер телефона, который использовал при покупке курса</p>
      <div class="phone-form">
        <input type="tel" class="phone-input" id="phoneInp" placeholder="+998 90 123 45 67" />
        <div class="error" id="phoneErr"></div>
        <button class="btn" onclick="loginByPhone()">Получить доступ →</button>
      </div>
      <a href="/" class="btn-outline" style="display:block; text-decoration:none; text-align:center; padding:14px">← На главную</a>
    `;
  }

  async function loginByPhone() {
    const inp = document.getElementById('phoneInp');
    const err = document.getElementById('phoneErr');
    const phone = inp?.value?.trim();
    if (!phone) return;

    err.style.display = 'none';

    try {
      const res = await fetch(`${API_URL}/api/access/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone }),
      });
      const data = await res.json();
      if (data.token) {
        localStorage.setItem('sc_token', data.token);
        localStorage.setItem('sc_phone', phone);
        renderSuccess(phone);
      } else {
        err.textContent = data.error || 'Доступ не найден';
        err.style.display = 'block';
      }
    } catch (e) {
      const errEl = document.getElementById('phoneErr');
      if (errEl) {
        errEl.textContent = 'Ошибка соединения';
        errEl.style.display = 'block';
      }
    }
  }

  init();
</script>
</body>
</html>
